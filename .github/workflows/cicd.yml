name: CI/CD to EC2

on:
  push:
    branches:
      - dev

env:
  JAVA_VERSION: '17' # Java 버전
  EC2_APP_PATH: '/home/ec2-user/app' # EC2에 애플리케이션을 배포할 경로
  JAR_FILE_NAME: 'SimpleLoginAPI-0.0.1-SNAPSHOT.jar' # 빌드될 JAR 파일 이름 (실제 이름으로 변경 필요)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build JAR
      run: ./gradlew bootJar

    - name: List JAR files (for debugging)
      run: ls -l build/libs/

    - name: Copy JAR to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: "./build/libs/*"
        target: "${{ env.EC2_APP_PATH }}/"
        strip_components: 2

    - name: SSH Commands and Start Application
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script_stop: true
        script: |
            exec > /tmp/deploy_script_debug.log 2>&1 # Redirect all output to a debug log file
            set -x # Enable command tracing

            echo "--- Starting SSH Script ---"
            echo "Current directory on EC2: $(pwd)"
            echo "EC2_APP_PATH: ${{ env.EC2_APP_PATH }}"
            echo "JAR_FILE_NAME: ${{ env.JAR_FILE_NAME }}"

            echo "Stopping existing application..."
            pkill -f 'java -jar' || true
            sleep 5 # 프로세스 종료 대기

            echo "Creating application directory if it doesn't exist..."
            mkdir -p ${{ env.EC2_APP_PATH }}
            MKDIR_EXIT_CODE=$?
            echo "mkdir exit code: $MKDIR_EXIT_CODE"
            if [ $MKDIR_EXIT_CODE -ne 0 ]; then
                echo "Error creating directory. Exiting."
                exit $MKDIR_EXIT_CODE
            fi

            echo "Starting new application..."
            setsid nohup java -jar ${{ env.EC2_APP_PATH }}/${{ env.JAR_FILE_NAME }} < /dev/null > ${{ env.EC2_APP_PATH }}/app.log 2>&1 &
            NOHUP_EXIT_CODE=$?
            echo "nohup command exit code: $NOHUP_EXIT_CODE"
            if [ $NOHUP_EXIT_CODE -ne 0 ]; then
                echo "Error starting application with nohup. Exiting."
                exit $NOHUP_EXIT_CODE
            fi

            echo "Deployment complete!"
            echo "--- SSH Script Finished ---"

