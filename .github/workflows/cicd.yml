
name: CI/CD to EC2

on:
  push:
    branches:
      - dev

env:
  JAVA_VERSION: '17' # Java 버전
  EC2_APP_PATH: '/home/ec2-user/app' # EC2에 애플리케이션을 배포할 경로
  JAR_FILE_NAME: 'SimpleLoginAPI-0.0.1-SNAPSHOT-plain.jar' # 빌드될 JAR 파일 이름 (실제 이름으로 변경 필요)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew bootJar

    - name: List JAR files
      run: ls -l build/libs/

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-app
        path: build/libs/${{ env.JAR_FILE_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: build # build job이 성공적으로 완료된 후에 실행

    steps:
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: spring-boot-app
        path: .

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: | # EC2에 접속하여 실행할 스크립트
            echo "Stopping existing application..."
            # 기존에 실행 중인 Spring Boot 애플리케이션 종료
            # pkill -f "java -jar"는 모든 java -jar 프로세스를 종료하므로, 다른 java 앱이 있다면 주의
            # 특정 jar 파일만 종료하려면 PID를 찾아서 kill 하는 로직이 필요할 수 있음
            pkill -f "${{ env.JAR_FILE_NAME }}" || true # 프로세스가 없어도 에러 발생하지 않도록 || true 추가
            sleep 5 # 프로세스 종료 대기

            echo "Creating application directory if it doesn't exist..."
            mkdir -p ${{ env.EC2_APP_PATH }}

            echo "Removing old JAR file..."
            rm -f ${{ env.EC2_APP_PATH }}/${{ env.JAR_FILE_NAME }}

            echo "Copying new JAR file..."
            # GitHub Actions runner에서 EC2로 JAR 파일 복사
            # artifact가 현재 디렉토리(.)에 다운로드되므로, ./JAR_FILE_NAME으로 접근
            mv ./${{ env.JAR_FILE_NAME }} ${{ env.EC2_APP_PATH }}/

            echo "Starting new application..."
            # 새 애플리케이션 백그라운드에서 실행
            # nohup을 사용하여 세션이 끊겨도 계속 실행되도록 함
            # > /dev/null 2>&1 & 는 모든 출력을 무시하고 백그라운드에서 실행
            nohup java -jar ${{ env.EC2_APP_PATH }}/${{ env.JAR_FILE_NAME }} > /dev/null 2>&1 &
            echo "Deployment complete!"
